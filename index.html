<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GraphQL Profile</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- LOGIN VIEW -->
  <section id="login-view">
    <div class="login-card">
      <h1>Login</h1>

      <form id="login-form">
        <label for="username">Username or email</label>
        <input type="text" id="username" name="username"
               placeholder="username or email" autocomplete="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="password" autocomplete="current-password" required>

        <button type="submit" id="login-btn">Login</button>
      </form>

      <p id="error" class="error" role="alert"></p>
    </div>
  </section>

  <!-- DASHBOARD VIEW -->
  <section id="dashboard-view" style="display:none;">
    <header class="dashboard-header">
      <span class="header-spacer"></span>
      <h1>Dashboard</h1>
      <button id="logout-btn">Logout</button>
    </header>

    <div class="section-controls">
      <button id="expand-all" type="button" class="btn-secondary">Expand all</button>
      <button id="collapse-all" type="button" class="btn-secondary">Collapse all</button>
    </div>

    <div id="profile">
      <!-- Section 1: User identification -->
      <details id="user-section" class="card" open>
        <summary><h2>User</h2></summary>
        <dl class="info">
          <dt>Login</dt>
          <dd id="user-login">—</dd>
          <dt>User ID</dt>
          <dd id="user-id">—</dd>
        </dl>
      </details>

      <!-- Section 2: XP -->
      <details id="xp-section" class="card" open>
        <summary><h2>XP</h2></summary>
        <dl class="info">
          <dt>Total XP</dt>
          <dd id="xp-total">—</dd>
        </dl>
      </details>

      <!-- Section 3: Audits -->
      <details id="grades-section" class="card" open>
        <summary><h2>Audit ratio</h2></summary>
        <dl class="info">
          <dt>Done</dt>
          <dd id="audit-done">—</dd>
          <dt>Received</dt>
          <dd id="audit-received">—</dd>
          <dt>Ratio</dt>
          <dd id="audit-ratio">—</dd>
        </dl>
      </details>

      <!-- Recent projects (uses a nested GraphQL query — Ticket 8) -->
      <details id="recent-section" class="card" open>
        <summary><h2>Recent projects</h2></summary>
        <ul id="recent-list" class="recent">
          <li>—</li>
        </ul>
      </details>

      <!-- Bonus: Skills breakdown (Ticket 14) — extra info beyond the three
           mandatory sections. Rendered as labelled bars, not an SVG graph, so
           it stays distinct from the Statistics section. -->
      <details id="skills-section" class="card" open>
        <summary><h2>Skills</h2></summary>
        <ul id="skills-list" class="skills">
          <li>—</li>
        </ul>
        <button id="skills-toggle" type="button" class="link-btn"
                aria-controls="skills-list" aria-expanded="false" hidden>
          Show more
        </button>
      </details>

      <!-- Section 4: Statistics — SVG graphs (Tickets 9/10/11) -->
      <details id="stats-section" class="card" open>
        <summary><h2>Statistics</h2></summary>
        <div class="graphs">
          <figure class="graph">
            <figcaption>XP over time</figcaption>
            <div id="graph-xp" class="graph-box">
              <p class="graph-placeholder">—</p>
            </div>
          </figure>
          <figure class="graph">
            <figcaption>Audit ratio</figcaption>
            <div id="graph-audit" class="graph-box">
              <p class="graph-placeholder">—</p>
            </div>
          </figure>
          <!-- Bonus third graph (Ticket 15) -->
          <figure class="graph graph-wide">
            <figcaption>XP by project</figcaption>
            <div id="graph-projects" class="graph-box">
              <p class="graph-placeholder">—</p>
            </div>
          </figure>
        </div>
      </details>
    </div>
  </section>

  <!-- Graph zoom overlay (lightbox) -->
  <div id="graph-modal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-content" role="dialog" aria-modal="true" aria-label="Enlarged graph">
      <button id="modal-close" class="modal-close" aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="./js/app.js"></script>
</body>
</html>
