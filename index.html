<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Everything the app needs and nothing more. `connect-src` names the
       platform because that is the only host it talks to (signin + GraphQL);
       `img-src data:` is there for the SVG graphs. No 'unsafe-inline' for
       scripts and no 'unsafe-eval': every script is an external module.
       Trusted Types is deliberately left out — the app writes trusted static
       markup through innerHTML in a few places, and enforcing it would break
       those silently rather than making anything safer. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 base-uri 'none';
                 object-src 'none';
                 script-src 'self';
                 style-src 'self';
                 connect-src 'self' https://platform.zone01.gr;
                 img-src 'self' data:;
                 form-action 'self';
                 frame-ancestors 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>GraphQL Profile - Zone01 stats dashboard</title>
  <meta name="description"
        content="Personal Zone01 profile dashboard: sign in with your platform
                 account to see your XP, audit ratio, recent projects and skills,
                 with SVG statistics graphs and a built-in GraphiQL playground.">

  <!-- No binary favicon in the repo, and inventing one would be a low-quality
       asset for its own sake. This is a hand-written data-URI SVG instead: a
       few bytes of text, no extra file, and it stops the browser's automatic
       /favicon.ico 404 on every load. Allowed by `img-src 'self' data:`. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a'/%3E%3Cpolyline points='6,24 13,14 19,19 26,8' fill='none' stroke='%2338bdf8' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="./css/style.css?v=2">
</head>
<body>

  <!-- LOGIN VIEW -->
  <section id="login-view">
    <div class="login-card">
      <h1>Login</h1>

      <form id="login-form">
        <label for="username">Username or email</label>
        <input type="text" id="username" name="username"
               placeholder="username or email" autocomplete="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="password" autocomplete="current-password" required>

        <button type="submit" id="login-btn">Login</button>
      </form>

      <p id="error" class="error" role="alert"></p>
    </div>
  </section>

  <!-- DASHBOARD VIEW -->
  <!-- Starts hidden via a class rather than an inline style attribute, which
       `style-src 'self'` in the CSP would block. showDashboard()/showLogin()
       set .style.display from JS, which is CSSOM and unaffected by the CSP. -->
  <section id="dashboard-view" class="view-hidden">
    <header class="dashboard-header">
      <span class="header-spacer"></span>
      <h1>Dashboard</h1>
      <button id="logout-btn">Logout</button>
    </header>

    <div class="section-controls">
      <button id="expand-all" type="button" class="btn-secondary">Expand all</button>
      <button id="collapse-all" type="button" class="btn-secondary">Collapse all</button>
    </div>

    <!-- Dashboard errors surface here. The login view's #error is hidden while
         the dashboard is shown, so section failures need their own region. -->
    <p id="dashboard-error" class="error" role="alert" hidden></p>

    <div id="profile">
      <!-- Section 1: User identification -->
      <details id="user-section" class="card" open>
        <summary><h2>User</h2></summary>
        <dl class="info">
          <dt>Login</dt>
          <dd id="user-login">—</dd>
          <dt>User ID</dt>
          <dd id="user-id">—</dd>
        </dl>
      </details>

      <!-- Section 2: XP -->
      <details id="xp-section" class="card" open>
        <summary><h2>XP</h2></summary>
        <dl class="info">
          <dt>Total XP</dt>
          <dd id="xp-total">—</dd>
        </dl>
      </details>

      <!-- Section 3: Audits -->
      <details id="grades-section" class="card" open>
        <summary><h2>Audit ratio</h2></summary>
        <dl class="info">
          <dt>Done</dt>
          <dd id="audit-done">—</dd>
          <dt>Received</dt>
          <dd id="audit-received">—</dd>
          <dt>Ratio</dt>
          <dd id="audit-ratio">—</dd>
        </dl>
      </details>

      <!-- Recent projects (uses a nested GraphQL query — Ticket 8) -->
      <details id="recent-section" class="card" open>
        <summary><h2>Recent projects</h2></summary>
        <ul id="recent-list" class="recent">
          <li>—</li>
        </ul>
        <button id="recent-toggle" type="button" class="link-btn"
                aria-controls="recent-list" aria-expanded="false" hidden>
          Show more
        </button>
      </details>

      <!-- Bonus: Skills breakdown (Ticket 14) — extra info beyond the three
           mandatory sections. Rendered as labelled bars, not an SVG graph, so
           it stays distinct from the Statistics section. -->
      <details id="skills-section" class="card" open>
        <summary><h2>Skills</h2></summary>
        <ul id="skills-list" class="skills">
          <li>—</li>
        </ul>
        <button id="skills-toggle" type="button" class="link-btn"
                aria-controls="skills-list" aria-expanded="false" hidden>
          Show more
        </button>
      </details>

      <!-- Section 4: Statistics — SVG graphs (Tickets 9/10/11) -->
      <details id="stats-section" class="card" open>
        <summary><h2>Statistics</h2></summary>
        <div class="graphs">
          <figure class="graph">
            <figcaption>XP over time</figcaption>
            <div id="graph-xp" class="graph-box" tabindex="0" role="button"
                 aria-label="XP over time graph — activate to enlarge">
              <p class="graph-placeholder">—</p>
            </div>
          </figure>
          <figure class="graph">
            <figcaption>Audit ratio</figcaption>
            <div id="graph-audit" class="graph-box" tabindex="0" role="button"
                 aria-label="Audit ratio graph — activate to enlarge">
              <p class="graph-placeholder">—</p>
            </div>
          </figure>
          <!-- Bonus third graph (Ticket 15) -->
          <figure class="graph graph-wide">
            <figcaption>XP by project</figcaption>
            <div id="graph-projects" class="graph-box" tabindex="0" role="button"
                 aria-label="XP by project graph — activate to enlarge">
              <p class="graph-placeholder">—</p>
            </div>
            <button id="projects-toggle" type="button" class="link-btn"
                    aria-controls="graph-projects" aria-expanded="false" hidden>
              Show more
            </button>
          </figure>
        </div>
      </details>

      <!-- Bonus: in-app GraphiQL (Ticket 16) — run arbitrary queries against
           the platform endpoint with the logged-in user's JWT. Collapsed by
           default so it doesn't compete with the profile itself. -->
      <details id="graphiql-section" class="card">
        <summary><h2>GraphiQL</h2></summary>

        <p class="hint">
          Run any query against the platform endpoint as the logged-in user.
          <kbd>Ctrl</kbd>+<kbd>Enter</kbd> runs it.
        </p>

        <div class="gql-examples">
          <span class="hint">Examples:</span>
          <button type="button" class="link-btn gql-example"
                  data-query="{ user { id login } }">User</button>
          <button type="button" class="link-btn gql-example"
                  data-query="{ transaction(where: { type: { _eq: &quot;xp&quot; } }) { amount } }">Total XP</button>
          <button type="button" class="link-btn gql-example"
                  data-query="{ transaction(where: { type: { _in: [&quot;up&quot;, &quot;down&quot;] } }) { type amount } }">Audits</button>
          <button type="button" class="link-btn gql-example"
                  data-query="{ result(where: { object: { type: { _eq: &quot;project&quot; } } } order_by: { createdAt: desc } limit: 5) { grade object { name type } } }">Recent projects</button>
        </div>

        <label class="gql-label" for="gql-query">Query</label>
        <textarea id="gql-query" class="gql-input" rows="8" spellcheck="false"
                  aria-describedby="gql-status">{ user { id login } }</textarea>

        <label class="gql-label" for="gql-variables">
          Variables <span class="hint">(JSON, optional)</span>
        </label>
        <textarea id="gql-variables" class="gql-input" rows="2"
                  spellcheck="false" placeholder="{}"></textarea>

        <div class="gql-actions">
          <button id="gql-run" type="button">Run query</button>
          <span id="gql-status" class="hint" role="status" aria-live="polite"></span>
        </div>

        <span class="gql-label" id="gql-result-label">Result</span>
        <pre id="gql-result" class="gql-result" tabindex="0"
             role="region" aria-labelledby="gql-result-label">Run a query to see the result.</pre>
      </details>
    </div>
  </section>

  <!-- Graph zoom overlay (lightbox) -->
  <div id="graph-modal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-content" role="dialog" aria-modal="true" aria-label="Enlarged graph">
      <button id="modal-close" class="modal-close" aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
