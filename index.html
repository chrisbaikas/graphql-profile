<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GraphQL Profile</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- LOGIN VIEW -->
  <section id="login-view">
    <h1>Login</h1>

    <form id="login-form">
      <label for="username">Username or email</label>
      <input type="text" id="username" name="username"
             placeholder="username or email" autocomplete="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             placeholder="password" autocomplete="current-password" required>

      <button type="submit" id="login-btn">Login</button>
    </form>

    <p id="error" role="alert"></p>
  </section>

  <!-- DASHBOARD VIEW -->
  <section id="dashboard-view" style="display:none;">
    <h1>Dashboard</h1>

    <button id="logout-btn">Logout</button>

    <div id="profile">
      <!-- Section 1: User identification -->
      <section id="user-section" class="card">
        <h2>User</h2>
        <dl class="info">
          <dt>Login</dt>
          <dd id="user-login">—</dd>
          <dt>User ID</dt>
          <dd id="user-id">—</dd>
        </dl>
      </section>

      <!-- Section 2: XP -->
      <section id="xp-section" class="card">
        <h2>XP</h2>
        <dl class="info">
          <dt>Total XP</dt>
          <dd id="xp-total">—</dd>
        </dl>
      </section>
    </div>
  </section>

  <script src="./js/app.js"></script>
</body>
</html>
